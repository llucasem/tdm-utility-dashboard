name: Sync utilities every 2 hours

# Vercel Hobby only allows one cron run per day, which is not enough to keep
# up with ~10 utility emails/day plus bursts. This workflow calls the same
# /api/sync endpoint the Vercel cron uses, authenticated via CRON_SECRET
# (middleware.js accepts "Authorization: Bearer ${CRON_SECRET}").

# Reactivado el 14/08/2026 tras validar el pipeline determinista de la fase 3
# contra datos de produccion: 73 emails en 2 pasadas, 0 errores, 0 llamadas a
# la IA. Si el sync devuelve algo distinto de HTTP 200 este workflow falla y
# GitHub avisa por email — esa es la alarma mientras retry-and-learn siga
# parado (ver CLAUDE.md, fase 4).
on:
  schedule:
    # Every 2 hours, on the half hour to avoid colliding with Vercel's
    # own 00:00 UTC cron run.
    - cron: '30 */2 * * *'
  # Manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}" \
            "https://edonis-utility-dashboard.vercel.app/api/sync")
          echo "$response"
          echo "$response" | grep -q "HTTP 200" || exit 1
